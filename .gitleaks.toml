# gitleaks configuration (used by the CI secret scan and by `gitleaks detect`
# locally). Extends the default rule set; the allow-list below covers the
# deliberately fake credentials the unit tests use as fixtures. Anything that
# looks like a real key outside those files fails the scan.
title = "sch"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and documented placeholders"
paths = [
  '''cli/tests/test_userenv\.py''',
  '''cli/tests/test_isolation_cli\.py''',
  '''cli/tests/test_verify_support\.py''',
  '''cli/tests/test_destroy\.py''',
  '''image/app/test_provider_api_keys\.py''',
  '''image/app/test_user_provider_keys\.py''',
  '''image/app/test_github_access\.py''',
  '''image/app/test_memory_footprint\.py''',
  '''image/app/test_owner_prefix\.py''',
  '''image/app/test_repo_bootstrap\.py''',
  '''image/app/test_sch_build_image\.py''',
  '''infra/simulate_isolation\.py''',
  '''infra/validate_isolation_policies\.py''',
  '''infra/test_isolation_.*\.py''',
  '''infra/test_workspace_registry_isolation\.py''',
  '''infra/test_task_watchdog_handler\.py''',
  '''infra/test_deploy_image_pin\.py''',
  '''\.backlog/tasks/.*''',
  '''\.backlog/docs/journal/.*''',
  '''docs/history/.*''',
  '''tunnel/package-lock\.json''',
]
regexes = [
  # Telegram token placeholder shown in docs/telegram-setup.md
  '''123456789:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx''',
  # AWS documentation sample account IDs used by tests
  '''111122223333''',
  '''123456789012''',
  # Synthetic key-shaped fixtures in bin/verify-user-provider-keys.sh.
  # Plumbing and secrecy assertions only; never real credentials.
  '''sk-verify-[A-Za-z0-9]+''',
  '''sk-or-v1-verify-[A-Za-z0-9]+''',
  # Synthetic per-principal owner keys used by isolation tests and simulator.
  # Sequential / repeated hex only; never real credentials.
  '''0123456789abcdef''',
  '''fedcba9876543210''',
  '''1111111111111111''',
  '''3f9c0e2a7b1d4c65''',
  '''a04be91c22d7f310''',
]
