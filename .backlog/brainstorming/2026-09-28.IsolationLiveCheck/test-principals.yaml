AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Temporary IAM users for the TASK-20 live check (bin/verify-isolation.sh):
  <project>-iso-b (listed in ISOLATED_PRINCIPALS) and <project>-iso-c (not
  listed). Their grants are deliberately broad on AgentCore and on the
  checkpoint bucket, so every denial the check expects must come from the
  plane resource policies, the access-role trust and the bucket policy, not
  from a missing identity grant. Delete this stack after the check.

Parameters:
  ProjectName:
    Type: String
    Default: sch
  Environment:
    Type: String
    Default: dev

Resources:
  CallerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-${Environment}-isolation-test-caller'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RegistryApi
            Effect: Allow
            Action: execute-api:Invoke
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*'
          - Sid: AgentCoreBroadOnPurpose
            Effect: Allow
            Action: 'bedrock-agentcore:*'
            Resource: '*'
          - Sid: EveryAccessRoleOnPurpose
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-o-*-access'
          - Sid: CheckpointBucketBroadOnPurpose
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:ListBucket
              - s3:ListBucketVersions
            Resource:
              - !Sub 'arn:aws:s3:::${ProjectName}-${Environment}-checkpoints-${AWS::AccountId}'
              - !Sub 'arn:aws:s3:::${ProjectName}-${Environment}-checkpoints-${AWS::AccountId}/*'
          - Sid: StackOutputs
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: '*'

  UserB:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub '${ProjectName}-iso-b'
      ManagedPolicyArns:
        - !Ref CallerPolicy

  UserC:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub '${ProjectName}-iso-c'
      ManagedPolicyArns:
        - !Ref CallerPolicy

Outputs:
  ListedUser:
    Description: Add as user:<this> to ISOLATED_PRINCIPALS
    Value: !Ref UserB
  UnlistedUser:
    Description: Must stay out of ISOLATED_PRINCIPALS
    Value: !Ref UserC
